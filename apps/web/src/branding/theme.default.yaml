# theme.default.yaml — brand-neutral defaults for Marginalia.
#
# To brand your deploy, copy or symlink this file to theme.yaml in the same
# directory and edit. theme.yaml is gitignored; the Vite theme plugin reads
# theme.yaml if present, else falls back to theme.default.yaml.
#
# All fields are optional — anything you omit keeps the default below. The
# values here are the committed, brand-neutral defaults: a warm-paper palette
# with a calm editorial-blue accent, Space Mono + Hanken Grotesk type. The
# fonts ship via the design-system token layer (tokens/fonts.css @imports
# them from Google Fonts), so the public build looks complete out of the box.
#
# See docs/theming.md for the full schema and per-deployer examples.

brand:
  # Browser tab title and (by default) the <h1> on the home page.
  page_title: "Marginalia"

  # Primary accent. Used for primary buttons, focus outlines, link colour,
  # the user-message bubble background, etc. Pick something with enough
  # contrast that white text reads on it. The accent tint/deep variants are
  # derived from this in tokens/colors.css.
  primary: "#2b62a8"
  # Slightly darker shade for hover/active states. Aim for ~10–15% darker.
  primary_dark: "#1c4474"

  # Font family slots. Strings are pasted verbatim as the CSS value of
  # font-family — quote any name with a space and supply fallbacks. The
  # defaults below match what tokens/fonts.css loads; override the families
  # here AND supply font_import_url if you switch to different webfonts.
  font_sans: '"Hanken Grotesk", -apple-system, system-ui, sans-serif'
  font_display: '"Hanken Grotesk", -apple-system, system-ui, sans-serif'
  font_mono: '"Space Mono", ui-monospace, "SF Mono", Menlo, monospace'
  # Only needed if you change the families above to fonts not already loaded
  # by tokens/fonts.css. e.g.:
  # font_import_url: "https://fonts.googleapis.com/css2?family=…&display=swap"

  # Optional background watermark. Set watermark_url to a path under
  # /branding/ (Vite serves apps/web/public/branding/ at /branding/*) or
  # null to disable. Opacity ~0.03–0.05 keeps text legible over it.
  watermark_url: null
  watermark_opacity: 0

  # Footer text shown on the home page.
  footer_text: "Marginalia · open source under Apache 2.0"

  # Favicon. Defaults to the SVG shipped at apps/web/public/favicon.svg.
  favicon_url: "/favicon.svg"
